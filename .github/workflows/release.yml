# 发布自动化：推送 vX.Y.Z Tag 时触发（流程见 docs/VERSIONING.md §6）
# 1) 校验 Tag 与根 package.json 统一版本号一致
# 2) 复跑三端质量门禁（与 CI 同一套命令）
# 3) 交叉编译 Agent 多平台产物（CGO_ENABLED=0，版本号经 ldflags 注入）
# 4) 提取 CHANGELOG 版本小节为发布说明，创建 GitHub Release 并附产物与校验和
# 手动 dispatch 仅做演练：构建产物并上传 artifact，不创建 Release。
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: 发布（门禁 → 多平台构建 → GitHub Release）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      - name: 校验 Tag 与统一版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} 与根 package.json 版本 v${VERSION} 不一致（唯一版本源规则见 docs/VERSIONING.md §3）"
            exit 1
          fi

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 质量门禁（三端，与 CI 同一套命令）
        run: |
          pnpm --filter @riricloud/server exec tsc --noEmit
          pnpm --filter @riricloud/server lint
          pnpm --filter @riricloud/server test
          pnpm --filter @riricloud/server build
          pnpm --filter @riricloud/web exec tsc --noEmit
          pnpm --filter @riricloud/web lint
          pnpm --filter @riricloud/web build
          bash scripts/gate-agent.sh

      - name: 构建 Agent 多平台产物
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd apps/agent
          mkdir -p "../../dist/riri-agent_${VERSION}_linux_amd64" \
                   "../../dist/riri-agent_${VERSION}_linux_arm64" \
                   "../../dist/riri-agent_${VERSION}_windows_amd64"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath \
            -ldflags "-X main.Version=${VERSION}" \
            -o "../../dist/riri-agent_${VERSION}_linux_amd64/riri-agent" .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath \
            -ldflags "-X main.Version=${VERSION}" \
            -o "../../dist/riri-agent_${VERSION}_linux_arm64/riri-agent" .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-X main.Version=${VERSION}" \
            -o "../../dist/riri-agent_${VERSION}_windows_amd64/riri-agent.exe" .

      - name: 打包与生成校验和
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd dist
          tar -czf "riri-agent_${VERSION}_linux_amd64.tar.gz" "riri-agent_${VERSION}_linux_amd64"
          tar -czf "riri-agent_${VERSION}_linux_arm64.tar.gz" "riri-agent_${VERSION}_linux_arm64"
          zip -q -r "riri-agent_${VERSION}_windows_amd64.zip" "riri-agent_${VERSION}_windows_amd64"
          sha256sum "riri-agent_${VERSION}_linux_amd64.tar.gz" \
                    "riri-agent_${VERSION}_linux_arm64.tar.gz" \
                    "riri-agent_${VERSION}_windows_amd64.zip" > checksums.txt
          ls -la

      - name: 提取 CHANGELOG 版本小节为发布说明
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = md.indexOf(`## [${version}]`);
            if (start < 0) {
              console.error(`CHANGELOG.md 未找到 [${version}] 版本小节（Tag 与 CHANGELOG 一一对应，见 docs/VERSIONING.md §5）`);
              process.exit(1);
            }
            let end = md.indexOf("\n## [", start + 1);
            if (end < 0) end = md.length;
            fs.writeFileSync("release-notes.md", md.slice(start, end).trim() + "\n");
          ' "$VERSION"
          head -5 release-notes.md

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/riri-agent_*.tar.gz dist/riri-agent_*.zip dist/checksums.txt
